<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 Forbidden</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-md border border-gray-100 p-8 text-center space-y-4">
    <p class="text-6xl font-extrabold text-blue-600">403</p>
    <h1 class="text-2xl font-bold text-gray-900">Access denied</h1>
    <p class="text-gray-600">
      You do not have permission to open this page.
      If you think this is a mistake, contact the administrator.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard:home' %}"
          class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold">Go to dashboard</a>
      {% else %}
        <a href="{% url 'login' %}"
          class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold">Sign in</a>
      {% endif %}
      <a href="{% url 'website:home' %}"
        class="px-5 py-2.5 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold">Back to website</a>
    </div>
  </div>
</body>
</html>
