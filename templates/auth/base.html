{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}International Class - Hasanuddin University{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'images/logoUnhas.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-redPrimary: #991b1b;
      --color-bluePrimary: #1e40af;
    }
  </style>
</head>
<body class="min-h-full bg-gray-100 text-gray-800">
  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">
      {% if messages %}
      <div class="space-y-2 mb-4">
        {% for m in messages %}<div class="bg-green-100 text-green-800 rounded-lg px-4 py-2 text-sm">{{ m }}</div>{% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
