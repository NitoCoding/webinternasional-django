{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}International Class - Hasanuddin University{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'images/logoUnhas.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-redPrimary: #991b1b;
      --color-bluePrimary: #1e40af;
    }
  </style>
</head>
<body class="flex flex-col min-h-full bg-white text-gray-800">
  {% include "partials/header.html" %}
  <main class="flex-1">
    {% block hero %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
</body>
</html>
