{% extends "dashboard/base.html" %}
{% block title %}Delete - Dashboard{% endblock %}
{% block heading %}Delete {{ spec.title }}{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow p-6 max-w-xl space-y-4">
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="px-6 py-2.5 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700">Yes, delete</button>
    <a href="{{ list_url }}" class="px-6 py-2.5 rounded-lg bg-gray-200 font-semibold">Cancel</a>
  </form>
</div>
{% endblock %}
