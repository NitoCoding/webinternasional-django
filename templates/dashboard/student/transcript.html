{% extends "dashboard/base.html" %}
{% block title %}Transcript - Dashboard{% endblock %}
{% block heading %}Academic Transcript{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-4">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 grid grid-cols-2 gap-4">
    <div>
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">NIM</p>
      <p class="text-sm text-gray-900 mt-1">{{ nim }}</p>
    </div>
    <div>
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Name</p>
      <p id="transcript-name" class="text-sm text-gray-900 mt-1">Loading...</p>
    </div>
  </div>

  <div id="transcript-notice" class="hidden rounded-lg p-4 text-sm"></div>

  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">No</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Code</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Subject</th>
            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">SKS</th>
            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">Letter</th>
            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">Numeric</th>
            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">Total</th>
          </tr>
        </thead>
        <tbody id="transcript-body" class="divide-y divide-gray-100">
          <tr><td colspan="7" class="px-4 py-10 text-center text-sm text-gray-500">Loading transcript...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  var dataUrl = "{{ data_url }}";
  var body = document.getElementById("transcript-body");
  var notice = document.getElementById("transcript-notice");
  var nameEl = document.getElementById("transcript-name");

  function setNotice(text, kind) {
    notice.textContent = text;
    notice.className = "rounded-lg p-4 text-sm " + (kind === "error"
      ? "bg-red-50 border border-red-200 text-red-700"
      : "bg-yellow-50 border border-yellow-200 text-yellow-800");
  }
  function cell(text, cls) {
    var td = document.createElement("td");
    td.className = "px-4 py-3 text-sm " + (cls || "text-gray-700");
    td.textContent = text;
    return td;
  }
  function renderEmpty(text) {
    body.textContent = "";
    var tr = document.createElement("tr");
    var td = document.createElement("td");
    td.colSpan = 7;
    td.className = "px-4 py-10 text-center text-sm text-gray-500";
    td.textContent = text;
    tr.appendChild(td);
    body.appendChild(tr);
  }
  function renderRows(rows) {
    body.textContent = "";
    if (!rows.length) { renderEmpty("No transcript data to show."); return; }
    rows.forEach(function (r, i) {
      var tr = document.createElement("tr");
      tr.className = "hover:bg-gray-50";
      tr.appendChild(cell(String(i + 1), "text-gray-900"));
      tr.appendChild(cell(r.kode));
      tr.appendChild(cell(r.mata_kuliah, "text-gray-900"));
      var sks = document.createElement("td");
      sks.className = "px-4 py-3 text-center";
      var badge = document.createElement("span");
      badge.className = "px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800";
      badge.textContent = String(r.sks);
      sks.appendChild(badge);
      tr.appendChild(sks);
      tr.appendChild(cell(r.huruf, "text-center"));
      tr.appendChild(cell(String(r.angka), "text-center"));
      tr.appendChild(cell(String(r.total), "text-center"));
      body.appendChild(tr);
    });
  }

  fetch(dataUrl, { credentials: "same-origin", headers: { Accept: "application/json" } })
    .then(function (resp) { return resp.json(); })
    .then(function (json) {
      nameEl.textContent = json.nama || "-";
      if (json.message) setNotice(json.message, json.ok ? "warn" : "error");
      renderRows(json.rows || []);
    })
    .catch(function () {
      nameEl.textContent = "-";
      setNotice("Could not load transcript. Please try again later.", "error");
      renderEmpty("No data to show.");
    });
})();
</script>
{% endblock %}
