{% extends "auth/base.html" %}
{% block title %}Login - International Class{% endblock %}
{% block content %}
<section class="container mx-auto px-6 py-16 max-w-md">
  <div class="bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Login</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full px-6 py-2.5 text-white bg-redPrimary rounded-full font-semibold hover:bg-redPrimary/90">Login</button>
    </form>
    <div class="mt-6 text-sm text-center text-gray-600 space-y-2">
      <p><a href="{% url 'password_reset' %}" class="text-redPrimary font-semibold hover:underline">Lupa password?</a></p>
      {% if allow_register %}
      <p>Don't have an account? <a href="{% url 'register' %}" class="text-redPrimary font-semibold hover:underline">Register</a></p>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
