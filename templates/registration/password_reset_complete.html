{% extends "auth/base.html" %}
{% block title %}Password Changed - International Class{% endblock %}
{% block content %}
<section class="container mx-auto px-6 py-16 max-w-md">
  <div class="bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Password changed successfully</h1>
    <p class="text-sm text-gray-600">Please log in with your new password.</p>
    <p class="mt-6 text-sm"><a href="{% url 'login' %}" class="px-6 py-2.5 inline-block text-white bg-redPrimary rounded-full font-semibold hover:bg-redPrimary/90">Login</a></p>
  </div>
</section>
{% endblock %}
