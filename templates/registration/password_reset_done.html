{% extends "auth/base.html" %}
{% block title %}Check Email - International Class{% endblock %}
{% block content %}
<h1 class="text-xl font-bold text-gray-900 mb-2">Check your email</h1>
<p class="text-sm text-gray-600">If the email is registered, a password reset link has been sent. Please check your inbox or spam folder.</p>
<p class="mt-5 text-sm text-center"><a href="{% url 'login' %}" class="text-blue-600 hover:underline font-semibold">Back to login</a></p>
{% endblock %}
