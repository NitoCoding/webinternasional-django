{% extends "auth/base.html" %}
{% block title %}Cek Email - International Class{% endblock %}
{% block content %}
<section class="container mx-auto px-6 py-16 max-w-md">
  <div class="bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Check your email</h1>
    <p class="text-sm text-gray-600">If the email is registered, a password reset link has been sent. Please check your inbox or spam folder.</p>
    <p class="mt-6 text-sm text-center"><a href="{% url 'login' %}" class="text-redPrimary font-semibold hover:underline">Back to login</a></p>
  </div>
</section>
{% endblock %}
