{% extends "auth/base.html" %}
{% block title %}Register - International Class{% endblock %}
{% block content %}
<section class="container mx-auto px-6 py-16 max-w-md">
  <div class="bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Register</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full px-6 py-2.5 text-white bg-redPrimary rounded-full font-semibold hover:bg-redPrimary/90">Register</button>
    </form>
    <p class="mt-6 text-sm text-center text-gray-600">Already have an account? <a href="{% url 'login' %}" class="text-redPrimary font-semibold hover:underline">Login</a></p>
  </div>
</section>
{% endblock %}
