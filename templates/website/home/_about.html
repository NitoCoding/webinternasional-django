        <!-- About Section -->
        <section class="container mx-auto px-6 py-20">
            <div class="grid lg:grid-cols-2 gap-16 items-center">
                <!-- Image Column -->
                <div class="relative" data-aos="fade-right" data-aos-duration="1200">
                    <div
                        class="absolute inset-0 bg-gradient-to-r from-redPrimary/20 to-blueSecondary/20 rounded-3xl transform rotate-6">
                    </div>
                    <div class="relative bg-white p-8 rounded-3xl shadow-2xl">
                        <img src="{{ settings.about_image_url }}" class="w-full h-auto object-contain rounded-2xl"
                            style="aspect-ratio: 1.52;" alt="About us illustration"
                            onerror="this.src='https://via.placeholder.com/600x400/f3f4f6/9ca3af?text=About+Us'" />
                    </div>
                </div>

                <!-- Text Column -->
                <div class="space-y-8" data-aos="fade-left" data-aos-duration="1200" data-aos-delay="200">
                    <div>
                        <h2 class="text-5xl lg:text-6xl font-bold text-gray-900 mb-6">
                            {{ settings.about_title }}
                        </h2>
                        <div class="w-24 h-2 bg-gradient-to-r from-redPrimary to-blueSecondary rounded-full"></div>
                    </div>

                    <p class="text-lg text-gray-600 leading-relaxed">
                        {{ settings.about_paragraph_1 }}
                    </p>

                    <p class="text-lg text-gray-600 leading-relaxed">
                        {{ settings.about_paragraph_2 }}
                    </p>
                </div>
            </div>
        </section>
